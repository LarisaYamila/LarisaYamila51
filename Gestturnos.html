  </header>

  <main class="container mt-4">
    <h2>Solicitar turno</h2>

    <form id="formTurno" class="row g-3 mb-4">
      <div class="col-md-6">
        <label for="dueno" class="form-label">Nombre del dueño</label>
        <input type="text" class="form-control" id="dueno" required>
      </div>
      <div class="col-md-6">
        <label for="mascota" class="form-label">Nombre de la mascota</label>
        <input type="text" class="form-control" id="mascota" required>
      </div>
      <div class="col-md-4">
        <label for="especie" class="form-label">Especie</label>
        <select class="form-select" id="especie" required>
          <option value="">Seleccionar...</option>
          <option>Perro</option>
          <option>Gato</option>
          <option>Otro</option>
        </select>
      </div>
      <div class="col-md-4">
        <label for="vete" class="form-label">veterinarios</label>
        <select class="form-select" id="vete" required>
          <option value="">Seleccionar...</option>
          <option>Dra. Sofia Perez</option>
          <option>Dr. Juan Gomez</option>
          <option>Dr. Carlos Benitez</option>
          <option>Dra. Laura Acuña</option>
        </select>
      </div>
      <div class="col-md-4">
        <label for="fecha" class="form-label">Fecha</label>
        <input type="date" class="form-control" id="fecha" required>
      </div>
      <div class="col-md-4">
        <label for="hora" class="form-label">Hora</label>
        <select class="form-select" id="hora" required>
          <option value="">Seleccionar...</option>
        </select>
      </div>
      <div class="col-12">
        <label for="motivo" class="form-label">Motivo de la consulta</label>
        <textarea class="form-control" id="motivo" rows="2" required></textarea>
      </div>
      <div class="col-12">
        <span id="mensaje" class="d-block mb-2"></span>
        <button type="submit" class="btn btn-primary">Solicitar turno</button>
      </div>
    </form>

    <h3>Turnos solicitados</h3>
    <div class="table-responsive">
      <table class="table table-striped align-middle">
        <thead>
          <tr>
            <th>Fecha</th><th>Hora</th><th>Dueño</th> <th>veterinario</th> <th>Mascota</th>
            <th>Especie</th><th>Motivo</th><th></th>
          </tr>
        </thead>
        <tbody id="tablaTurnos"></tbody>
      </table>
    </div>
    <p id="sinTurnos" class="text-muted d-none">Todavía no hay turnos cargados.</p>
  </main>

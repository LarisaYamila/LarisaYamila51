<form action=" " method="POST">
        <h2>Contacto</h2>
        
        
        <div class="form-group">
            <label for="motivo">Motivo de contacto:</label>
            <select id="motivo" name="motivo" required>
                <option value="" disabled selected>Selecciona una opción</option>
                <option value="baño">Baño de mascotas</option>
                <option value="consultas">Consultas</option>
                <option value="exoticos">Animales exóticos</option>
            </select>
        </div>

        <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>
        </div>

        <div class="form-group">
            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido" required>
        </div>

        <div class="form-group">
            <label for="tipo_mascota">Tipo de mascotas:</label>
            <input type="text" id="tipo_mascota" name="tipo_mascota" placeholder="Ej: Perro, Gato, Reptil..." required>
        </div>

        <div class="form-group">
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="comentarios">Comentarios:</label>
            <textarea id="comentarios" name="comentarios" rows="4" required></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Enviar</button>
    </form>

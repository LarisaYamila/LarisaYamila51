<section class="container vh-100 d-flex justify-content-center align-items-center">
  <article class="col-12 col-md-6">
    <form class="d-flex flex-column gap-3" id="formPaciente">
      <h3 class="text-center">Gestionar Pacientes</h3>
      
          <div class="form-group">
            <label for="altaMascota">Tipo Mascota</label>
            <select id="altaMascota" class="form-control" required>
              <option value="" disabled selected>Selecciona una opción</option>
              <option value="pequenos">Pequeños animales</option>
              <option value="ovinos">Ovinos</option>
              <option value="exoticos">Exóticos</option>
            </select>
          </div>

          <div>
            <label for="nombreMascota" class="form-label">Nombre Mascota:</label>
            <input type="text" id="nombreMascota" class="form-control" required>
          </div>
          <div>
            <label for="nombreDuenio" class="form-label">Nombre Dueño:</label>
            <input type="text" id="nombreDuenio" class="form-control" required>
          </div>
          <div>
            <label for="color" class="form-label">Color:</label>
            <input type="text" id="color" class="form-control" required>
          </div>
          <div>
            <label for="edad" class="form-label">Edad:</label>
            <input type="number" id="edad" class="form-control" required>
          </div>
          <div>
            <label for="peso" class="form-label">Peso:</label>
            <input type="number" id="peso" class="form-control" required>
          </div>
         <div class="d-grid gap-2 col-6 mx-auto">
        <button class="btn btn-primary" type="submit">Guardar</button>
  

</div>
    </form>
  </article>
</section>

<article>

  <span class="badge rounded-pill bg-primary" id="mensaje" class="text-center mt-3"> PACIENTES INTERNADOS</span>
  <h3>Listado de Pacientes</h3>
  <span class=" badge text-bg-secondary" id="PacientesInternados" ></span>
<ul class="list-group mt-3 " id="lista-pacientes"></ul>

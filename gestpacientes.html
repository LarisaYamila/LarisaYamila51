<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alta Pacientes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="estilos.css">
  <script type="module" src="pacientes.js"></script>
</head>
<body>
  <header class="bg-light py-3 mb-4" >
    <h1>Veterinaria La Mary</h1>
    
  </header>
   <ul class="nav nav-tabs" mb-4>
  <li class="nav-item">
    <a class="nav-link active" aria-current="page" href="Inicio.html">Inicio</a>
  </li>
  <li class="nav-item">
    <a class="nav-link" href="MiCuenta.html">Mi Cuenta</a>
  </li>
  <li class="nav-item">
    <a class="nav-link" href="contacto.html">Contacto</a>
  </li>
    <li class="nav-item">
        <a class="nav-link" href="institucional.html">Institucional</a>
    </li>
    <li class="nav-item">
        <a class="nav-link" href="profesionales.html">Profesionales</a>
    </li>
    
    </ul> 

 ><main class="container my-4">
    <section class="row justify-content-center">
      <article class="col-12 col-md-8">
        <form class="d-flex flex-column gap-3 p-4 border rounded shadow-sm bg-light" id="formPaciente">
          <h3 class="text-center mb-3">Gestionar Pacientes</h3>
      
          <div class="form-group">
            <label for="altaMascota" class="form-label">Tipo de Mascota (Selección):</label>
            <select id="altaMascota" class="form-control" required>
              <option value="" disabled selected>Selecciona una opción</option>
              <option value="Pequeños animales">Pequeños animales</option>
              <option value="Ovinos">Ovinos</option>
              <option value="Exóticos">Exóticos</option>
            </select>
          </div>

          <div>
            <label for="nombreMascota" class="form-label">Nombre Mascota:</label>
            <input type="text" id="nombreMascota" class="form-control" required>
          </div>
          <div>
            <label for="tipoMascota" class="form-label" >Tipo de Mascota:</label>
            <input type="text" id="tipoMascota" class="form-control" placeholder="Ej: Perro, Gato, etc." required>
          </div>
          
          <div>
            <label for="nombreDuenio" class="form-label">Nombre Dueño:</label>
            <input type="text" id="nombreDuenio" class="form-control" required>
          </div>
          <div>
            <label for="color" class="form-label">Color:</label>
            <input type="text" id="color" class="form-control" required>
          </div>
          <div>
            <label for="edad" class="form-label">Edad:</label>
            <input type="number" id="edad" class="form-control" required>
          </div>
          <div>
            <label for="peso" class="form-label">Peso:</label>
            <input type="number" id="peso" step="0.01" class="form-control" required>
          </div>
         <div class="d-grid gap-2 col-6 mx-auto" mt-2>
        <button class="btn btn-primary" type="submit">Guardar</button>
  

</div>
    </form>

<h3 class="mt-4">Listado de Pacientes</h3>
<span class="badge text-bg-secondary" id="PacientesInternados">0</span>
<ul class="list-group mt-3" id="lista-pacientes"></ul>

        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Tipo</th>
                <th>Dueño</th>
                <th>Color</th>
                <th>Edad</th>
                <th>Peso</th>
              </tr>


</thead>
            <tbody id="cuerpo-tabla">
            </tbody>
          </table>
        </div>
      </article>
    </section>

  </main>

  <footer>
    <p class="text-center mt-5">&copy; 2026 Veterinaria La Mary. Todos los derechos reservados.</p>
  </footer>
</body>
</html>

<div>

  <input type="text" id="nombreVeterinario" class="form-control" required>
</div>
<div>

</div>
<div>
  <label for="ValorConsulta" class="form-label">Valor de la Consulta:</label>
  <input type="number" id="ValorConsulta" step="0.01" class="form-control" required>
</div>
<div class="d-grid gap-2 col-6 mx-auto">
  <button class="btn btn-primary" type="submit">Guardar</button>
  

</div>
      </form>
